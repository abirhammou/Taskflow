name: TaskFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-task-service:
    name: Build Task Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Task Service
        working-directory: TaskFlow_backend/Task_service
        run: mvn clean package -DskipTests

  build-gateway:
    name: Build API Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build API Gateway
        working-directory: TaskFlow_backend/ApiGateway
        run: mvn clean package -DskipTests

  build-auth-service:
    name: Build Auth Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install & Test
        working-directory: TaskFlow_backend/auth-service
        run: npm install

  build-frontend:
  name: Build Frontend
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Install & Build
      working-directory: frontend
      run: |
        npm install
        npx ng build --configuration production