apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: eureka
  namespace: taskflow
spec:
  serviceName: eureka
  replicas: 1
  selector:
    matchLabels:
      app: eureka
  template:
    metadata:
      labels:
        app: eureka
    spec:
      containers:
        - name: eureka
          image: taskflow-eureka:latest
          imagePullPolicy: Never          # use local minikube image
          ports:
            - containerPort: 8761
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: eureka
  namespace: taskflow
spec:
  selector:
    app: eureka
  ports:
    - port: 8761