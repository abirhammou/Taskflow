<mat-toolbar class="topbar">
  <button mat-icon-button (click)="toggleMobileNav.emit()" *ngIf="!showToggle">
    <i-tabler name="menu-2" class="icon-20 d-flex"></i-tabler>
  </button>

  <button mat-icon-button aria-label="Notifications">
    <i-tabler class="d-flex" name="bell" matBadge="1" matBadgeColor="primary"></i-tabler>
  </button>

  <span class="flex-1-auto"></span>

  <button mat-icon-button [matMenuTriggerFor]="profilemenu">
    <img [src]="avatarUrl"
         class="rounded-circle object-cover"
         width="35"
         [alt]="username" />
  </button>

  <mat-menu #profilemenu="matMenu" class="topbar-dd cardWithShadow">
    <!-- User info header -->
    <div class="px-3 py-2 border-bottom">
      <p class="mb-0 fw-bold">{{ username }}</p>
      <small class="text-muted">Administrator</small>
    </div>

    <button mat-menu-item [routerLink]="['/dashboard/profile']">
      <mat-icon class="d-flex align-items-center">
        <i-tabler name="user" class="icon-18 d-flex"></i-tabler>
      </mat-icon>
      My Profile
    </button>
    
    <button mat-menu-item>
      <mat-icon class="d-flex align-items-center">
        <i-tabler name="list-check" class="icon-18 d-flex"></i-tabler>
      </mat-icon>
      My Task
    </button>

    <div class="p-x-12 m-t-12">
      <button mat-stroked-button color="warn" class="w-100" (click)="logout()">
        Logout
      </button>
    </div>
  </mat-menu>
</mat-toolbar>
