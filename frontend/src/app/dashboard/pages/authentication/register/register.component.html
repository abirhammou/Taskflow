<div class="blank-layout-container justify-content-center align-items-center bg-light-primary">
  <div class="position-relative row w-100 h-100 bg-gredient justify-content-center">
    <div class="col-lg-4 d-flex align-items-center">
      <mat-card class="cardWithShadow boxed-auth">
        <mat-card-content class="p-32 text-center">

          <div class="text-center mb-4">
            <a [routerLink]="['/']">
              <img src="./assets/images/logos/dark-logo.svg" class="align-middle m-2" alt="logo" />
            </a>
          </div>

          <h2 class="mb-2">Create an Account</h2>
          <p class="text-muted mb-4">
            You'll be redirected to our secure registration page
          </p>

          <button mat-flat-button color="primary" class="w-100 mb-3" (click)="register()">
            Create Account
          </button>

          <span class="d-block f-w-500 text-center m-t-24">
            Already have an Account?
            <a [routerLink]="['/authentication/login']"
               class="text-decoration-none text-primary f-w-500 f-s-14">
              Sign In
            </a>
          </span>

        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
