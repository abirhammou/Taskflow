<div class="blank-layout-container justify-content-center align-items-center bg-light-primary">
  <div
    class="position-relative row w-100 h-100 bg-gredient justify-content-center"
  >
    <div class="col-lg-4 d-flex align-items-center">
      <mat-card class="cardWithShadow boxed-auth">
        <mat-card-content class="p-32">
          <div class="text-center">
            <a [routerLink]="['/dashboard']">
              <img
                src="./assets/images/logos/dark-logo.svg"
                class="align-middle m-2"
                alt="logo"
              />
            </a>
          </div>


          <div class="or-border m-t-30">sign in</div>

          <form [formGroup]="form" (ngSubmit)="submit()" class="m-t-30">

  <div *ngIf="error" class="alert alert-danger p-2 mb-3">{{ error }}</div>

  <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Email</mat-label>
  <mat-form-field appearance="outline" class="w-100" color="primary">
    <input matInput type="email" formControlName="email" placeholder="your@email.com" />
    <mat-error *ngIf="f['email'].hasError('required')">Email is required</mat-error>
  </mat-form-field>

  <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Password</mat-label>
  <mat-form-field appearance="outline" class="w-100" color="primary">
    <input matInput type="password" formControlName="password" />
    <mat-error *ngIf="f['password'].hasError('required')">Password is required</mat-error>
  </mat-form-field>

  <div class="d-flex align-items-center m-b-12">
    <mat-checkbox color="primary">Remember this Device</mat-checkbox>
  </div>

  <button type="submit" mat-flat-button color="primary" class="w-100" [disabled]="loading">
    {{ loading ? 'Signing in...' : 'Sign In' }}
  </button>

</form>
          <span class="d-block f-w-500 text-center m-t-24"
            >New to Modernize?
            <a
              [routerLink]="['/authentication/register']"
              class="text-decoration-none text-primary f-w-500 f-s-14"
            >
              Create an account</a
            >
          </span>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
