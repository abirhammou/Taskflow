<div class="p-4">

  <!-- Loading -->
  <div *ngIf="loading" class="text-center py-5">
    <mat-spinner diameter="40" class="mx-auto"></mat-spinner>
  </div>

  <div *ngIf="!loading && user">

    <!-- Header Card -->
    <mat-card class="cardWithShadow mb-4">
      <mat-card-content class="p-4">
        <div class="d-flex align-items-center gap-4">
          <div class="admin-avatar">{{ getInitials() }}</div>
          <div>
            <h4 class="mb-1 fw-bold">{{ user.username }}</h4>
            <span class="admin-badge">{{ user.role }}</span>
            <p class="text-muted mb-0 mt-1 f-s-12">{{ user.email }}</p>
          </div>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- Alerts -->
    <div *ngIf="success" class="alert alert-success mb-3">✅ {{ success }}</div>
    <div *ngIf="error"   class="alert alert-danger  mb-3">❌ {{ error }}</div>

    <!-- Edit Form Card -->
    <mat-card class="cardWithShadow">
      <mat-card-content class="p-4">
        <h5 class="fw-bold mb-4">Edit Profile</h5>

        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="row g-3">

            <div class="col-md-6">
              <mat-label class="f-s-14 f-w-600 d-block mb-2">Username</mat-label>
              <mat-form-field appearance="outline" class="w-100">
                <input matInput formControlName="username" placeholder="Username" />
                <mat-error *ngIf="f['username'].hasError('required')">Required</mat-error>
                <mat-error *ngIf="f['username'].hasError('minlength')">Min 3 characters</mat-error>
              </mat-form-field>
            </div>

            <div class="col-md-6">
              <mat-label class="f-s-14 f-w-600 d-block mb-2">Email</mat-label>
              <mat-form-field appearance="outline" class="w-100">
                <input matInput formControlName="email" type="email" placeholder="Email" />
                <mat-error *ngIf="f['email'].hasError('required')">Required</mat-error>
                <mat-error *ngIf="f['email'].hasError('email')">Invalid email</mat-error>
              </mat-form-field>
            </div>

            <div class="col-md-6">
              <mat-label class="f-s-14 f-w-600 d-block mb-2">Role</mat-label>
              <mat-form-field appearance="outline" class="w-100">
                <input matInput [value]="user.role" readonly />
              </mat-form-field>
            </div>

            <div class="col-md-6">
              <mat-label class="f-s-14 f-w-600 d-block mb-2">Member Since</mat-label>
              <mat-form-field appearance="outline" class="w-100">
                <input matInput [value]="user.createdAt | date:'mediumDate'" readonly />
              </mat-form-field>
            </div>

            <div class="col-md-6">
              <mat-label class="f-s-14 f-w-600 d-block mb-2">
                New Password <span class="text-muted">(optional)</span>
              </mat-label>
              <mat-form-field appearance="outline" class="w-100">
                <input matInput formControlName="password" type="password"
                       placeholder="Leave blank to keep current" />
              </mat-form-field>
            </div>

            <div class="col-md-6">
              <mat-label class="f-s-14 f-w-600 d-block mb-2">Confirm Password</mat-label>
              <mat-form-field appearance="outline" class="w-100">
                <input matInput formControlName="confirmPassword" type="password" />
                <mat-error *ngIf="form.hasError('mismatch')">Passwords do not match</mat-error>
              </mat-form-field>
            </div>

          </div>

          <div class="mt-3">
            <button mat-flat-button color="primary" type="submit"
                    [disabled]="saving || form.invalid">
              {{ saving ? 'Saving...' : 'Save Changes' }}
            </button>
          </div>
        </form>

      </mat-card-content>
    </mat-card>
  </div>
</div>
