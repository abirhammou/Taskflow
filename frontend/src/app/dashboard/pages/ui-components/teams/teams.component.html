<div class="container py-4">

  <!-- Header -->
  <div class="fo-page-header d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="mb-1">Teams</h4>
      <p class="text-muted mb-0">Collaborate with your team members</p>
    </div>
    <button class="btn btn-primary" (click)="openModal()">+ New Team</button>
  </div>

  <!-- Search Bar -->
  <!-- Search Bar -->
<div class="search-bar mb-4">
  <div class="input-group">
    <span class="input-group-text bg-white border-end-0">🔍</span>
    <input type="text" class="form-control border-start-0"
           placeholder="Search by name, department..."
           [(ngModel)]="searchQuery" (input)="search()">
  </div>
</div>
  <!-- Teams Grid -->
  <div class="row g-4">
    <div class="col-md-6 col-lg-4" *ngFor="let team of filteredTeams; let i = index">
      <div class="fo-team-card">
        <div class="team-header" [style.background]="getColor(i)">
          <span class="team-icon">{{ getIcon(i) }}</span>
        </div>
        <div class="team-body">
          <div class="d-flex justify-content-between align-items-start mb-1">
            <h6 class="team-name mb-0">{{ team.name }}</h6>
            <div class="team-actions">
              <button class="btn-action edit" (click)="openEditModal(team, i)" title="Edit">✏️</button>
              <button class="btn-action delete" (click)="deleteTeam(team.id)" title="Delete">🗑️</button>
            </div>
          </div>
          <p class="team-desc">{{ team.description }}</p>
          <div class="team-meta d-flex justify-content-between align-items-center">
            <span class="badge bg-secondary">{{ team.department }}</span>
            <span class="team-tasks">{{ team.memberCount }} members</span>
          </div>
          <div class="team-progress mt-3">
            <div class="d-flex justify-content-between mb-1">
              <small class="text-muted">Status</small>
              <small class="fw-bold" [style.color]="team.isActive ? '#13deb9' : '#fa5c7c'">
                {{ team.isActive ? 'Active' : 'Inactive' }}
              </small>
            </div>
            <div class="progress" style="height:6px;">
              <div class="progress-bar"
                   [style.width]="team.isActive ? '100%' : '30%'"
                   [style.background]="getColor(i)"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div class="col-12 text-center py-5" *ngIf="filteredTeams.length === 0">
      <p class="text-muted">No teams found.</p>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <div class="modal-header-custom">
      <h5>{{ isEditMode ? 'Edit Team' : 'New Team' }}</h5>
      <button class="btn-close-custom" (click)="closeModal()">✕</button>
    </div>
    <div class="modal-body-custom">
      <div class="mb-3">
        <label class="form-label">Team Name *</label>
        <input type="text" class="form-control" [(ngModel)]="newTeam.name" placeholder="Ex: Frontend Team">
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" [(ngModel)]="newTeam.description" rows="3" placeholder="Team description..."></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Department *</label>
        <input type="text" class="form-control" [(ngModel)]="newTeam.department" placeholder="Ex: Engineering">
      </div>
      <div class="mb-3">
        <label class="form-label">Member Count</label>
        <input type="number" class="form-control" [(ngModel)]="newTeam.memberCount" min="0">
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" [(ngModel)]="newTeam.isActive" id="isActive">
        <label class="form-check-label" for="isActive">Active Team</label>
      </div>
    </div>
    <div class="modal-footer-custom">
      <button class="btn btn-secondary" (click)="closeModal()">Cancel</button>
      <button class="btn btn-primary" (click)="saveTeam()">
        {{ isEditMode ? 'Update' : 'Save' }}
      </button>
    </div>
  </div>
</div>
