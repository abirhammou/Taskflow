<nav class="fo-navbar navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/">
      <span class="brand-icon">✦</span> TaskFlow
    </a>
    <button class="navbar-toggler" type="button" (click)="toggleMenu()">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" [class.show]="menuOpen">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/app/tasks" routerLinkActive="active">Tasks</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/app/my-teams" routerLinkActive="active">Teams</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/app/projects" routerLinkActive="active">Projects</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/app/notifications" routerLinkActive="active">
            Notifications
            <span class="notif-badge">3</span>
          </a>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item">
          <a class="nav-link" routerLink="/app/profile" routerLinkActive="active">
            <img [src]="avatarUrl"
                 class="avatar-img"
                 [alt]="username">
            {{ username }}
          </a>
        </li>
        <!-- Only show for ADMIN -->
        <li class="nav-item ms-2" *ngIf="isAdmin">
          <a class="btn btn-outline-primary btn-sm" routerLink="/dashboard">Admin</a>
        </li>
        <!-- Logout -->
        <li class="nav-item ms-2">
          <button class="btn btn-outline-danger btn-sm" (click)="logout()">
            Logout
          </button>
        </li>
      </ul>
