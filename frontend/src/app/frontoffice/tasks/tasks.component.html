<div class="container py-4">
  <div class="fo-page-header d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="mb-1">My Tasks</h4>
      <p class="text-muted mb-0">Track and manage your work</p>
    </div>
    <button class="btn btn-primary" (click)="openTaskDialog()">+ New Task</button>
  </div>

  <!-- Search bar -->
  <div class="mb-3">
    <input type="text" class="form-control" placeholder="Search by title or description..."
           (input)="onSearch($event)" />
  </div>

  <!-- Stats -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3" *ngFor="let stat of stats">
      <div class="fo-stat-card">
        <div class="stat-value">{{ stat.value }}</div>
        <div class="stat-label">{{ stat.label }}</div>
        <div class="stat-bar" [style.background]="stat.color"></div>
      </div>
    </div>
  </div>

  <!-- Filter Tabs -->
  <div class="fo-tabs mb-3">
    <button *ngFor="let tab of tabs"
      class="fo-tab"
      [class.active]="activeTab === tab"
      (click)="activeTab = tab; applyFilter()">
      {{ tab }}
    </button>
  </div>

  <!-- Task List -->
  <div class="fo-task-list">
    <div class="fo-task-card" *ngFor="let task of filteredTasksList">
      <div class="d-flex align-items-start gap-3">
        <input type="checkbox" class="fo-checkbox mt-1" [checked]="task.completed"
               (change)="toggleComplete(task)">
        <div class="flex-grow-1">
          <div class="d-flex justify-content-between">
            <span class="task-title" [class.done]="task.completed">{{ task.title }}</span>
            <div>
              <button class="btn btn-sm btn-outline-primary me-1" (click)="openTaskDialog(task)">
                <i class="bi bi-pencil"></i> Edit
              </button>
              <button class="btn btn-sm btn-outline-danger" (click)="deleteTask(task.id)">
                <i class="bi bi-trash"></i> Delete
              </button>
            </div>
          </div>
          <div class="task-meta mt-1">
            <span class="me-3">📝 {{ task.description || 'No description' }}</span>
            <span>📅 {{ task.dueDate | date:'dd MMM yyyy' }}</span>
          </div>
        </div>
      </div>
    </div>
    <div *ngIf="filteredTasksList.length === 0" class="text-center text-muted py-4">
      No tasks found.
    </div>
  </div>
</div>
