<h2 mat-dialog-title>{{ isEdit ? 'Modifier la phase' : 'Nouvelle phase' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="phase-dialog-content">

    <mat-form-field appearance="outline" class="full">
      <mat-label>Nom de la phase</mat-label>
      <input matInput formControlName="nom" placeholder="ex: Conception" />
      <mat-error *ngIf="form.get('nom')?.hasError('required')">Le nom est obligatoire</mat-error>
      <mat-error *ngIf="form.get('nom')?.hasError('minlength')">2 caractères minimum</mat-error>
    </mat-form-field>

    <div class="row-2">
      <mat-form-field appearance="outline">
        <mat-label>Ordre</mat-label>
        <input matInput type="number" formControlName="ordre" placeholder="1" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Avancement (%)</mat-label>
        <input matInput type="number" formControlName="pourcentageAvancement" min="0" max="100" />
        <mat-error>Entre 0 et 100</mat-error>
      </mat-form-field>
    </div>

    <div class="row-2">
      <mat-form-field appearance="outline">
        <mat-label>Date de début</mat-label>
        <input matInput [matDatepicker]="d1" formControlName="dateDebut" />
        <mat-datepicker-toggle matIconSuffix [for]="d1"></mat-datepicker-toggle>
        <mat-datepicker #d1></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Date de fin</mat-label>
        <input matInput [matDatepicker]="d2" formControlName="dateFin" />
        <mat-datepicker-toggle matIconSuffix [for]="d2"></mat-datepicker-toggle>
        <mat-datepicker #d2></mat-datepicker>
      </mat-form-field>
    </div>

  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Annuler</button>
    <button mat-raised-button color="primary" type="submit">
      {{ isEdit ? 'Enregistrer' : 'Ajouter' }}
    </button>
  </mat-dialog-actions>
</form>
