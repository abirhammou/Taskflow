<h2 mat-dialog-title>{{ isEdit ? 'Modifier le projet' : 'Nouveau projet' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="projet-dialog-content">

    <mat-form-field appearance="outline" class="full">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="nom" placeholder="Nom du projet" />
      <mat-error *ngIf="form.get('nom')?.hasError('required')">Le nom est obligatoire</mat-error>
      <mat-error *ngIf="form.get('nom')?.hasError('minlength')">3 caractères minimum</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3"
                placeholder="Description (optionnelle)"></textarea>
    </mat-form-field>

    <div class="row-2">
      <mat-form-field appearance="outline">
        <mat-label>Date de début</mat-label>
        <input matInput [matDatepicker]="d1" formControlName="dateDebut" />
        <mat-datepicker-toggle matIconSuffix [for]="d1"></mat-datepicker-toggle>
        <mat-datepicker #d1></mat-datepicker>
        <mat-error>Obligatoire</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Date de fin prévue</mat-label>
        <input matInput [matDatepicker]="d2" formControlName="dateFinPrevue" />
        <mat-datepicker-toggle matIconSuffix [for]="d2"></mat-datepicker-toggle>
        <mat-datepicker #d2></mat-datepicker>
        <mat-error>Obligatoire</mat-error>
      </mat-form-field>
    </div>

    <div class="row-2">
      <mat-form-field appearance="outline">
        <mat-label>Statut</mat-label>
        <mat-select formControlName="statut">
          <mat-option *ngFor="let s of statuts" [value]="s">{{ statutMeta[s].label }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Priorité</mat-label>
        <mat-select formControlName="priorite">
          <mat-option *ngFor="let p of priorites" [value]="p">{{ prioriteMeta[p].label }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="row-2">
      <mat-form-field appearance="outline">
        <mat-label>Budget (€)</mat-label>
        <input matInput type="number" formControlName="budget" placeholder="0" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Chef de projet (ID)</mat-label>
        <input matInput type="number" formControlName="chefProjetId" placeholder="ID utilisateur" />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full" *ngIf="isEdit">
      <mat-label>Date de fin réelle</mat-label>
      <input matInput [matDatepicker]="d3" formControlName="dateFinReelle" />
      <mat-datepicker-toggle matIconSuffix [for]="d3"></mat-datepicker-toggle>
      <mat-datepicker #d3></mat-datepicker>
    </mat-form-field>

  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Annuler</button>
    <button mat-raised-button color="primary" type="submit">
      {{ isEdit ? 'Enregistrer' : 'Créer' }}
    </button>
  </mat-dialog-actions>
</form>
