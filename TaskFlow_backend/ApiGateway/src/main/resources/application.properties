spring.application.name=ApiGateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.routes[0].id=task-service
spring.cloud.gateway.routes[0].uri=lb://Task_service
spring.cloud.gateway.routes[0].predicates[0]=Path=/tasks/**

spring.cloud.gateway.routes[1].id=team-service
spring.cloud.gateway.routes[1].uri=lb://team-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/teams/**

spring.cloud.gateway.routes[2].id=prixticket-service
spring.cloud.gateway.routes[2].uri=lb://prixticket-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/prix-tickets/**