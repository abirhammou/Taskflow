spring.application.name=ApiGateway
server.port=8085

# Eureka
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Discovery
spring.cloud.gateway.discovery.locator.enabled=false

# Routes
spring.cloud.gateway.routes[0].id=team-service
spring.cloud.gateway.routes[0].uri=lb://TEAM-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/teams/**

spring.cloud.gateway.routes[1].id=task-service
spring.cloud.gateway.routes[1].uri=lb://TASK-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/task/**

# Routes Swagger - Team Service
spring.cloud.gateway.routes[2].id=team-service-docs
spring.cloud.gateway.routes[2].uri=lb://TEAM-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/team-service/v3/api-docs
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/team-service/v3/api-docs,/v3/api-docs

# Routes Swagger - Task Service
spring.cloud.gateway.routes[3].id=task-service-docs
spring.cloud.gateway.routes[3].uri=lb://TASK-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/task-service/v3/api-docs
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/task-service/v3/api-docs,/v3/api-docs

# CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# Keycloak JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8096/realms/taskflow

# Swagger centralisé
springdoc.swagger-ui.urls[0].name=Team Service
springdoc.swagger-ui.urls[0].url=/team-service/v3/api-docs

springdoc.swagger-ui.urls[1].name=Task Service
springdoc.swagger-ui.urls[1].url=/task-service/v3/api-docs

springdoc.swagger-ui.urls[2].name=ApiGateway
springdoc.swagger-ui.urls[2].url=/v3/api-docs